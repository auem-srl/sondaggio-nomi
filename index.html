<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root { color-scheme: light; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Branding aziendale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: home = headline, intro, Start. Phase 1 = per name (random order): naked name screen, then 5 questions. No way back. */
:root {
  --bg: #F1F3F8;
  --surface: #FFFFFF;
  --ink: #11162B;
  --muted: #586078;
  --line: #D6DBE8;
  --accent: #2D3CE6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E6FD;
  --ok: #1B7F4B;
  --warn: #9A5B00;
  --font-display: 'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1120;
    --surface: #161B30;
    --ink: #EDEFF8;
    --muted: #9AA3BF;
    --line: #2A3150;
    --accent: #8793FF;
    --accent-ink: #0D1120;
    --accent-soft: #232A55;
    --ok: #5FD39A;
    --warn: #F0B35A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1120;
  --surface: #161B30;
  --ink: #EDEFF8;
  --muted: #9AA3BF;
  --line: #2A3150;
  --accent: #8793FF;
  --accent-ink: #0D1120;
  --accent-soft: #232A55;
  --ok: #5FD39A;
  --warn: #F0B35A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: clamp(16px, 5vw, 56px);
  padding-block: 20px 64px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: clamp(28px, 6vw, 56px); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mark { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.03em; }
.eyebrow, .tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }

/* Home */
.home { display: flex; flex-direction: column; gap: clamp(24px, 4vw, 40px); }
.home h1 { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 800; line-height: 1.01; max-width: 14ch; }
.intro { display: flex; flex-direction: column; gap: 10px; max-width: 56ch; margin-top: 20px; color: var(--muted); font-size: 1.1rem; }
.intro p { margin: 0; }
.intro p:first-child { color: var(--ink); font-size: 1.2rem; }
.cta { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.meta { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 16px 30px; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; letter-spacing: -0.01em; transition: transform .15s ease, opacity .15s ease; }
.primary:hover:not(:disabled) { transform: translateY(-2px); }
.primary:disabled { opacity: .35; cursor: not-allowed; }
.ghost { background: none; border: 0; padding: 8px 0; color: var(--muted); font-size: .95rem; }
.ghost:hover { color: var(--ink); }
.foot { display: flex; justify-content: flex-end; }

/* Quiz */
.quiz, .done, .results { width: 100%; max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
.qbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s ease; }
.slide { display: flex; flex-direction: column; gap: 22px; padding-top: clamp(8px, 3vw, 28px); min-width: 0; }
.slide h2, .done h2, .results h2 { font-size: clamp(1.7rem, 4.6vw, 2.6rem); font-weight: 700; line-height: 1.1; }
.hint { color: var(--muted); margin: 0; }
@keyframes inFwd { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
.in-fwd { animation: inFwd .3s ease-out both; }

/* Name shown bare: same neutral font, same size, black on white, for every name */
.naked { background: #FFFFFF; color: #000000; border: 1px solid var(--line); border-radius: 14px; min-height: clamp(190px, 36vw, 300px); display: grid; place-items: center; padding: 24px 16px; }
.naked span { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: clamp(1.5rem, 7vw, 3rem); letter-spacing: 0; line-height: 1; white-space: nowrap; }
.namebar { align-self: flex-start; background: #FFFFFF; color: #000000; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 1rem; line-height: 1.2; margin-bottom: 18px; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 96px; padding: 10px 2px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; transition: border-color .15s ease, background .15s ease; min-width: 0; }
.sc b { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; line-height: 1; }
.sc span { font-size: .72rem; line-height: 1.15; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
.sc:hover { border-color: var(--accent); }
.sc.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sc.sel span { color: var(--accent-ink); }

textarea, input[type="text"] { width: 100%; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--font-body); font-size: 1rem; line-height: 1.5; }
textarea { min-height: 150px; resize: vertical; }
textarea:focus-visible, input[type="text"]:focus-visible { border-color: var(--accent); }
.fields { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; color: var(--muted); }
.actions { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

/* Done + results */
.status { font-size: .95rem; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); margin: 0; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.secondary { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 20px; font-weight: 500; }
.secondary:hover { border-color: var(--accent); }
.block { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.block h3 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; letter-spacing: -0.01em; }
.block h4 { margin: 8px 0 0; font-size: .85rem; font-weight: 500; color: var(--muted); }
.bar { display: grid; grid-template-columns: minmax(0, 11rem) 1fr 2.4rem; gap: 12px; align-items: center; font-size: .95rem; }
.bar .bl { overflow-wrap: anywhere; }
.track { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); }
.bn { font-family: var(--font-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  .in-fwd { animation: none; }
  .progress i, .primary, .sc { transition: none; }
}

/* Fase 1: nome da solo, sempre nero su bianco, stesso carattere */
.qbar .tag { margin: 0; }
.stim { background: #FFFFFF; color: #000000; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; text-align: center; border-radius: 14px; border: 1px solid var(--line); }
.stim span { display: block; white-space: nowrap; }
.stim.big { padding: clamp(40px, 12vw, 96px) 16px; font-size: clamp(1.3rem, 7.4vw, 4rem); }
.stim.sm { padding: 16px; font-size: clamp(1.2rem, 5vw, 1.6rem); }
.fields { display: flex; flex-direction: column; gap: 10px; }
input[type="text"] { width: 100%; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--font-body); font-size: 1rem; }
input[type="text"]:focus-visible { border-color: var(--accent); }
.primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.scale.lab .sc { aspect-ratio: auto; max-height: none; min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 4px; font-size: 1rem; }
.scale.lab .sc .num { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1; }
.scale.lab .sc small { font-family: var(--font-body); font-size: .85rem; font-weight: 500; opacity: .85; }
@media (max-width: 560px) {
  .scale.lab { grid-template-columns: 1fr; }
  .scale.lab .sc { flex-direction: row; justify-content: flex-start; gap: 16px; min-height: 56px; padding: 10px 18px; }
  .scale.lab .sc small { font-size: 1rem; }
}
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
th.num, td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.hi { color: var(--accent); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 12px; font-size: .9rem; overflow-wrap: anywhere; }

/* Fasi 2-8 */
.infobox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(20px, 4vw, 32px); display: flex; flex-direction: column; gap: 14px; }
.infobox p { margin: 0; font-size: clamp(1.1rem, 2.6vw, 1.35rem); line-height: 1.45; }
.ctx { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; color: var(--muted); }
.lockups { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
.stim.lock { text-align: left; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; font-weight: 400; }
.stim.lock .lk-n { font-weight: 700; font-size: clamp(1.1rem, 4.6vw, 1.5rem); white-space: nowrap; }
.stim.lock .lk-d { font-size: .95rem; white-space: normal; }
.opt.nm-opt .lbl { font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; font-size: 1.25rem; letter-spacing: 0; }
.opt .lbl .lk-n { display: block; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; font-size: 1.2rem; }
.opt .lbl .lk-d { display: block; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 400; font-size: .9rem; color: var(--muted); margin-top: 2px; }
.opt.multi .ck { display: none; }
.opt.multi.sel .ck { display: inline; }
.opt.multi.sel .k { display: none; }
.opt.off { opacity: .45; }
.selcount { margin: 0; min-height: 1.2em; font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.whyl { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
td.hineg { color: var(--warn); font-weight: 600; }

/* Opzioni di risposta */
.opts { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .opts.two { grid-template-columns: 1fr 1fr; } }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 1.05rem; min-width: 0; transition: border-color .15s ease, background .15s ease; }
.opt:hover { border-color: var(--accent); }
.opt .key { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.opt .lbl { min-width: 0; overflow-wrap: anywhere; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Registro risultati */
.reg { width: 100%; max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.reg h2 { font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; line-height: 1.1; margin: 0; }
.regtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.regtop .tag { margin: 0; }
.rg-tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.rg-tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-weight: 500; color: var(--muted); margin-bottom: -1px; }
.rg-tab:hover { color: var(--ink); }
.rg-tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.rg-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rg-filters, .rg-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rg-chip { background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .95rem; }
.rg-chip.on { background: var(--accent-soft); border-color: var(--accent); }
.secondary { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 18px; font-weight: 500; }
.secondary:hover:not(:disabled) { border-color: var(--accent); }
.secondary:disabled, .ghost:disabled { opacity: .4; cursor: not-allowed; }
.rg-danger { background: var(--warn); color: var(--bg); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; }
.rg-v { margin: 0; overflow-wrap: anywhere; }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.entry { display: flex; flex-direction: column; gap: 18px; }
.entry .field { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; color: var(--muted); min-width: 0; }
.rg-meta { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
input[type="date"] { width: 100%; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; font-family: var(--font-body); font-size: 1rem; }
.rg-order { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.rg-lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rg-chips { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.rg-chips li { background: var(--accent-soft); border-radius: 8px; padding: 4px 10px; font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; font-size: .9rem; display: flex; gap: 8px; align-items: center; }
.rg-chips li b { font-family: var(--font-mono); font-weight: 500; color: var(--accent); }
.rg-h { font-family: var(--font-display); font-size: 1.3rem; margin: 10px 0 0; }
.rg-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px 18px 18px; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.rg-card legend { padding: 0 8px; font-weight: 600; max-width: 100%; }
.rg-pos { font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-left: 10px; font-weight: 500; }
.rg-three { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); }
.rg-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .95rem; }
.rg-seg { display: flex; gap: 6px; }
.rg-so, .rg-o { position: relative; }
.rg-so input, .rg-o input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.rg-so span { display: grid; place-items: center; width: 42px; height: 42px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); font-family: var(--font-mono); }
.rg-so input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rg-so input:focus-visible + span, .rg-o input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.rg-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.rg-o span { display: inline-block; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 14px; background: var(--bg); overflow-wrap: anywhere; }
.rg-o input:checked + span { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }

tr.base td { color: var(--muted); border-top: 2px solid var(--line); font-size: .85rem; }

/* Indietro */
.qnav { min-height: 36px; display: flex; align-items: center; margin-bottom: -12px; }
@keyframes inBack { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
.in-back { animation: inBack .3s ease-out both; }
@media (prefers-reduced-motion: reduce) { .in-back { animation: none; } }
</style>

</head>
<body>
<div class="app">
  <header class="top"><span class="mark">Branding aziendale</span></header>
  <main id="view"></main>
</div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  var NAMES = [
    { id: 'A', name: 'AUEM' },
    { id: 'B', name: 'CAVALLO' },
    { id: 'C', name: 'CAVALLO SPAZI' },
    { id: 'D', name: 'HOLOS' },
    { id: 'E', name: 'SPAZIOPRONTO' },
    { id: 'F', name: 'SPAZIOUFFICIO' }
  ];
  var DESC = {
    'AUEM': 'Spazi professionali',
    'CAVALLO': 'Spazi professionali',
    'CAVALLO SPAZI': 'Progettazione e realizzazione',
    'HOLOS': 'Space Design',
    'SPAZIOPRONTO': 'Progettazione e realizzazione di spazi professionali',
    'SPAZIOUFFICIO': 'Progettazione e realizzazione'
  };
  var QUOTES = {
    'AUEM': '“AUEM.”',
    'CAVALLO': '“Cavallo.”',
    'CAVALLO SPAZI': '“Cavallo Spazi.”',
    'HOLOS': '“Holos.”',
    'SPAZIOPRONTO': '“SpazioPronto.”',
    'SPAZIOUFFICIO': '“SpazioUfficio.”'
  };
  var RECALL = {
    'AUEM': /auem/i,
    'CAVALLO': /cavallo(?!\s*spazi)/i,
    'CAVALLO SPAZI': /cavallo\s*spazi/i,
    'HOLOS': /holos/i,
    'SPAZIOPRONTO': /spazio\s*pronto/i,
    'SPAZIOUFFICIO': /spazio\s*ufficio/i
  };
  var NONE = '__none__';
  var SCALE = ['Per niente', 'Poco', 'Abbastanza', 'Molto', 'Moltissimo'];
  var LS_KEY = 'branding-progress-v2';

  /* Fase 1: stesse cinque domande, ripetute per ogni nome. */
  var P1 = [
    { key: 'd1', type: 'long', hint: 'Scrivi la prima cosa che ti viene in mente.',
      text: function (n) { return 'Senza altre informazioni, cosa pensi faccia un’azienda chiamata “' + n + '”?'; } },
    { key: 'd2', type: 'three', text: 'Quali 3 caratteristiche ti trasmette questo nome?' },
    { key: 'd3', type: 'rate', text: 'Quanto trovi questo nome facile da ricordare?' },
    { key: 'd4', type: 'rate', text: 'Quanto ti sembra professionale e autorevole?' },
    { key: 'd5', type: 'rate', text: 'Quanto ti sembra adatto a un’azienda a cui affidare un progetto importante?' }
  ];

  /* Fasi 2–8. col = etichetta breve per la tabella dei risultati. */
  var AFTER = [
    { type: 'info', tag: 'L’azienda', paras: [

  var st = { view: 'home', i: 0, steps: [], order: [], sel: [], answers: { p1: {} }, dir: 'fwd', save: 'idle', res: null, tab: 'riepilogo', detail: null, filter: 'tutte', msg: '', msgKind: 'ok', conf: null, editId: null };

  function clearAns(s) {

  function readFields(s) {

  function updateMulti() {

  function onNext() {

    if (!canAdvance(s)) return;
    if (s.type === 'long' || s.type === 'recall' || s.type === 'three') setAns(s, readFields(s));
    else if (s.type === 'multi') setAns(s, realSel());

  /* Saltare una domanda non registra nulla e passa alla successiva. */

  function pick(btn) {

    else val = valsFor(s)[parseInt(btn.getAttribute('data-i'), 10)];
    if (val === undefined || (typeof val === 'number' && isNaN(val))) return;
    setAns(s, val);

  }

  /* ---------- Fine e salvataggio ---------- */
  function summaryText() {
    var L = [];
    st.order.forEach(function (name) {
      var o = st.answers.p1[name] || {};
      L.push(name);
      if (o.d1) L.push('  Cosa fa: ' + o.d1);
      if (o.d2) L.push('  Caratteristiche: ' + o.d2.join(', '));
      var nv = function (x) { return x === undefined ? '\u2014' : x; };
      L.push('  Facile da ricordare ' + nv(o.d3) + '/5, professionale ' + nv(o.d4) + '/5, adatto a un progetto importante ' + nv(o.d5) + '/5');
    });
    AFTER.forEach(function (q) {
      if (!q.id) return;
      var a = st.answers[q.id];
      if (a === undefined) return;
      L.push(q.text + ' ' + (Array.isArray(a) ? (a.length ? a.join(', ') : 'Nessuno') : (a === '' ? '(vuoto)' : a)));
      if (q.id === 'd20' && st.answers.d20why) L.push('  Perché: ' + st.answers.d20why);
    });
    return L.join('\n');
  }

  var sendId = null;
  function newId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'r-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function endpoint() { return (window.SONDAGGIO && window.SONDAGGIO.endpoint) || ''; }

  /* Invia le risposte al Foglio Google. L'id evita i doppioni se l'invio viene ripetuto. */
  async function send() {
    var url = endpoint();
    if (!url) { st.save = 'local'; return; }
    if (!sendId) sendId = newId();
    var body = JSON.stringify({ id: sendId, submittedAt: new Date().toISOString(), version: 3, order: st.order.slice(), answers: st.answers });
    try {
      var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body, redirect: 'follow' });
      var j = null;
      try { j = await res.json(); } catch (e) {}
      st.save = (res.ok && j && j.ok === true) ? 'saved' : 'failed';
    } catch (e) {
      /* Se l'esito non è leggibile (CORS), il server può aver ricevuto comunque l'invio: si ripete senza leggerlo. */
      try {
        await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
        st.save = 'saved';
      } catch (e2) { st.save = 'failed'; }
    }
  }

  async function submit() {
    clearProgress();
    st.view = 'done'; st.save = 'saving'; render();
    try { window.scrollTo(0, 0); } catch (e) {}
    await send();
    if (st.view === 'done') render();
  }
  async function retry() {
    st.save = 'saving'; render();
    await send();
    if (st.view === 'done') render();
  }

  function doneHTML() {
    var s = st.save, h = '<section class="done">';
    h += '<div><p class="tag">Fatto</p><h2>Grazie per le risposte.</h2></div>';
    if (s === 'saving') h += '<p class="status">Sto inviando le risposte…</p>';
    else if (s === 'saved') h += '<p class="status ok">Risposte inviate.</p>';
    else {
      h += '<p class="status warn">' + (s === 'local'
        ? 'Il sondaggio non è ancora collegato a un archivio, quindi le risposte non sono state inviate.'
        : 'Non siamo riusciti a inviare le risposte. Controlla la connessione e riprova.') + '</p>';
      h += '<textarea id="sum" readonly>' + esc(summaryText()) + '</textarea>';
      h += '<div class="actions">' + (s === 'failed' ? '<button class="primary" data-act="retry">Riprova</button>' : '') +
        '<button class="' + (s === 'failed' ? 'secondary' : 'primary') + '" data-act="copy" id="copyBtn">Copia il riepilogo</button></div>';
    }
    return h + '</section>';
  }

  function copySummary() {
    var btn = document.getElementById('copyBtn'), ta = document.getElementById('sum');
    var ok = function () { if (btn) btn.textContent = 'Copiato'; };
    var fallback = function () { if (ta) { ta.focus(); ta.select(); } if (btn) btn.textContent = 'Testo selezionato, copialo'; };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(summaryText()).then(ok, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }

  /* ---------- Render e eventi ---------- */
  function render() {
    if (st.view === 'home') view.innerHTML = homeHTML();
    else if (st.view === 'quiz') {
      st.sel = initialSel(st.steps[st.i]);
      view.innerHTML = quizHTML();
      updateMulti();
      var f = document.getElementById('f0');
      if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} }
    }
    else if (st.view === 'done') view.innerHTML = doneHTML();
  }

  view.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'start') start();
    else if (act === 'pick') pick(b);
    else if (act === 'toggle') toggle(b);
    else if (act === 'next') onNext();
    else if (act === 'skip') skipStep();
    else if (act === 'back') back();
    else if (act === 'copy') copySummary();
    else if (act === 'retry') retry();
  });

  view.addEventListener('input', function (e) {
    if (!e.target.closest || !e.target.closest('.fields')) return;
    var s = st.steps[st.i], btn = document.getElementById('next');
    if (s && btn && s.type !== 'recall') btn.disabled = !canAdvance(s);
  });

  document.addEventListener('keydown', function (e) {
    if (st.view !== 'quiz' || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target, s = st.steps[st.i];
    if (t && t.tagName === 'INPUT' && e.key === 'Enter') {
      e.preventDefault();
      var k = parseInt(t.id.replace('f', ''), 10), nx = document.getElementById('f' + (k + 1));
      if (nx) nx.focus();
      else { var nb = document.getElementById('next'); if (nb && !nb.disabled) nb.click(); }
      return;
    }
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
    var key = e.key.toLowerCase(), btn = null;
    if (s.type === 'rate' && /^[1-5]$/.test(key)) btn = view.querySelector('.sc[data-n="' + key + '"]');
    else if (s.type === 'choice' || s.type === 'multi' || s.type === 'objection') {
      var idx = /^[a-j]$/.test(key) ? key.charCodeAt(0) - 97 : (/^[1-9]$/.test(key) ? parseInt(key, 10) - 1 : -1);
      if (idx >= 0) btn = view.querySelector('.opt[data-i="' + idx + '"]');
      else if (e.key === 'Enter' && s.type !== 'choice') btn = document.getElementById('next');
    } else if ((s.type === 'stim' || s.type === 'info' || s.type === 'lockups') && e.key === 'Enter') btn = document.getElementById('next');
    if (btn && !btn.disabled) {
      e.preventDefault();
      var a = btn.getAttribute('data-act');
      if (a === 'pick') pick(btn); else if (a === 'toggle') toggle(btn); else btn.click();
    }
  });

  restore();
  render();
})();
</script>
</body>
</html>
